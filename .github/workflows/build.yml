name: Build Apps

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  android:
    runs-on: ubuntu-latest

    # Secrets cannot be referenced directly in a step-level `if`, so they are
    # lifted into env here and the steps branch on env instead.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # Java 17, not 21: this project pins Gradle 8.2.1 (via the Capacitor
      # wrapper), and Gradle only gained Java 21 support in 8.5. Building on
      # 21 fails with "Unsupported class file major version 65".
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          set -e
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          cd "$SDK_ROOT/cmdline-tools"
          curl -sS -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip
          mv cmdline-tools latest
          rm cmdtools.zip
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses > /dev/null
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install dependencies
        run: npm ci

      - name: Run engine tests
        run: npm test

      - name: Build web assets
        run: npx vite build

      - name: Sync Capacitor
        run: npx cap sync android

      # A release keystore is used when the repo has KEYSTORE_BASE64 set.
      # Without it the workflow still produces a debug-signed APK, which
      # sideloads onto a phone perfectly well.
      - name: Decode release keystore
        id: keystore
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No release keystore configured — building a debug-signed APK."
          fi

      - name: Build release APK
        if: steps.keystore.outputs.present == 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$PWD/app/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          cp app/build/outputs/apk/release/app-release.apk ../pgc-scorer.apk

      - name: Build debug APK
        if: steps.keystore.outputs.present == 'false'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../pgc-scorer.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pgc-scorer-apk
          path: pgc-scorer.apk
          retention-days: 90

      # A rolling "latest" release gives a stable link to open on the phone.
      - name: Publish to latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ADS Falcons Scorer — latest build
          body: |
            Install on Android: download `pgc-scorer.apk` below, open it, and
            allow installation from this source when prompted.

            There is no signed iOS build here — Apple requires a paid
            Developer Program membership to sign an app for installation on
            a real iPhone. The `ios` job in this workflow only proves the
            iOS project builds cleanly for the Simulator; see its log for
            details. The web app itself can be added to an iPhone home
            screen as a PWA from the GitHub Pages deployment of this repo
            (Safari → Share → Add to Home Screen) with no signing needed.

            Built from commit ${{ github.sha }}.
          files: pgc-scorer.apk

  ios:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npx vite build

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        working-directory: ios/App
        run: pod install

      # No Apple Developer account/certificate is configured, so this is a
      # Simulator-only, unsigned build. It proves the iOS project compiles
      # cleanly from this source — it does not produce anything installable
      # on a real iPhone. Device installation requires a paid Apple
      # Developer Program membership and a signing certificate +
      # provisioning profile; once those exist, this job can be extended
      # (the same way the Android job uses a release keystore) to produce a
      # signed, device-installable or TestFlight-ready build.
      - name: Build for iOS Simulator (unsigned)
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || true

  pages:
    needs: android
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npx vite build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
